name: '1b. Core Infrastructure Destroy'

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Terraform Init
      run: terraform init -reconfigure
      working-directory: ./infra/env

    - name: Azure Login (Required for Firewall Punch)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Firewall Punch - Whitelist Current Destroy Runner IP
      run: |
        CURRENT_IP=$(curl -s https://ifconfig.me)
        echo "INFO - Whitelisting Destroy Runner IP: $CURRENT_IP"
        az storage account network-rule add \
          --resource-group rg-afdap123987123 \
          --account-name samainafdap123987123 \
          --ip-address $CURRENT_IP || echo "WARNING - Storage account not found or already gone."

    - name: Terraform Destroy
      run: terraform destroy -auto-approve
      working-directory: ./infra/env

    - name: Firewall Clean - Remove Destroy Runner IP
      if: always()
      run: |
        CURRENT_IP=$(curl -s https://ifconfig.me)
        echo "INFO - Removing Destroy Runner IP: $CURRENT_IP"
        az storage account network-rule remove \
          --resource-group rg-afdap123987123 \
          --account-name samainafdap123987123 \
          --ip-address $CURRENT_IP || echo "WARNING - Storage account already removed by destroy."