name: '4b. F1 Aggregation CD'

on:
  workflow_run:
    workflows: ["3b. F1 Transformation CD"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACR_NAME: 'acrafdap123987123'
  RESOURCE_GROUP: 'rg-afdap123987123'
  ACI_NAME: 'ci-f1-gold-aggregation-afdap123987123'
  PYTHONUNBUFFERED: '1'
  AZURE_STORAGE_ACCOUNT_URL: 'https://samainafdap123987123.blob.core.windows.net'
  START_SEASON: '2014'
  END_SEASON: '2025'
  SILVER_CONTAINER_NAME: 'silver'
  GOLD_CONTAINER_NAME: 'gold'

jobs:
  lint:
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/90_reusable-lint.yml
  build-and-run-aggregation:
    needs: lint
    if: |
      always() &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to Azure Container Registry
      run: az acr login --name ${{ env.ACR_NAME }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Aggregation Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/aggregation/f1_to_gold/Dockerfile
        push: true
        tags: |
          ${{ env.ACR_NAME }}.azurecr.io/f1_gold_aggregation:latest
          ${{ env.ACR_NAME }}.azurecr.io/f1_gold_aggregation:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update ACI to run latest aggregation image
      run: |
        USER_MI_CLIENT_ID=$(az identity show \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name id-f1-aggregation-afdap123987123 \
          --query clientId \
          --output tsv)
        
        az container create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.ACI_NAME }} \
          --image ${{ env.ACR_NAME }}.azurecr.io/f1_gold_aggregation:${{ github.sha }} \
          --os-type Linux \
          --restart-policy Never \
          --cpu 0.5 \
          --memory 1.0 \
          --assign-identity "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-f1-aggregation-afdap123987123" \
          --acr-identity "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-f1-aggregation-afdap123987123" \
          --environment-variables \
            PYTHONUNBUFFERED="1" \
            AZURE_STORAGE_ACCOUNT_URL="${{ env.AZURE_STORAGE_ACCOUNT_URL }}" \
            START_SEASON="${{ env.START_SEASON }}" \
            END_SEASON="${{ env.END_SEASON }}" \
            AZURE_CLIENT_ID="$USER_MI_CLIENT_ID" \
            SILVER_CONTAINER_NAME="${{ env.SILVER_CONTAINER_NAME }}" \
            GOLD_CONTAINER_NAME="${{ env.GOLD_CONTAINER_NAME }}"

    - name: Stream Container Runtime Logs
      run: |
        az container logs \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.ACI_NAME }} \
          --follow