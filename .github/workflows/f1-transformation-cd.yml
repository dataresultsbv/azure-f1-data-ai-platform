name: '3b. F1 Transformation CD'

on:
  workflow_run:
    workflows: ["2b. F1 Ingestion CD"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACR_NAME: 'acrafdap123987123'
  RESOURCE_GROUP: 'rg-afdap123987123'
  ACI_NAME: 'ci-f1-silver-transformation-afdap123987123'
  PYTHONUNBUFFERED: '1'
  AZURE_STORAGE_ACCOUNT_URL: 'https://stafdap123987123.dfs.core.windows.net'
  START_SEASON: '2014'
  END_SEASON: '2025'

jobs:
  build-and-run-transformation:
    name: 'Build and Run Transformation'
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC (Managed Identity)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to Azure Container Registry
      run: az acr login --name ${{ env.ACR_NAME }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Transformation Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/transformation/f1_to_silver/Dockerfile # Specifieke dockerfile
        push: true
        tags: |
          ${{ env.ACR_NAME }}.azurecr.io/f1_silver_transformation:latest
          ${{ env.ACR_NAME }}.azurecr.io/f1_silver_transformation:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Get ACR Credentials
      run: |
        ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
        echo "::add-mask::$ACR_PASSWORD"
        echo "PASSWORD=$ACR_PASSWORD" >> $GITHUB_ENV

    - name: Update ACI to run latest transformation image
      run: |
        az container create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.ACI_NAME }} \
          --image ${{ env.ACR_NAME }}.azurecr.io/f1_silver_transformation:${{ github.sha }} \
          --os-type Linux \
          --restart-policy Never \
          --cpu 0.5 \
          --memory 1.0 \
          --registry-login-server ${{ env.ACR_NAME }}.azurecr.io \
          --registry-username ${{ env.ACR_NAME }} \
          --registry-password ${{ env.PASSWORD }} \
          --assign-identity "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-f1-transformation-afdap123987123" \
          --environment-variables PYTHONUNBUFFERED="1" AZURE_STORAGE_ACCOUNT_URL=${{ env.AZURE_STORAGE_ACCOUNT_URL }} START_SEASON=${{ env.START_SEASON }} END_SEASON=${{ env.END_SEASON }}

    - name: Stream Container Runtime Logs
      run: |
        az container logs \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.ACI_NAME }} \
          --follow