name: '5. F1 Dashboard CD'

on:
  workflow_run:
    workflows: ["4b. F1 Aggregation CD"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RESOURCE_GROUP: 'rg-afdap123987123'
  STORAGE_ACCOUNT_NAME: 'samainafdap123987123'
  GOLD_CONTAINER_NAME: 'gold'
  SWA_NAME: 'swa-f1-dashboard-afdap123987123'
  DASHBOARD_DIR: 'f1-dashboard'

jobs:
  build-and-deploy-dashboard:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Fetch Gold Parquet Data from ADLS Gen2
      run: |
        mkdir -p ./${{ env.DASHBOARD_DIR }}/sources/f1_gold_data/
        az storage blob download-batch \
          --account-name ${{ env.STORAGE_ACCOUNT_NAME }} \
          --destination ./${{ env.DASHBOARD_DIR }}/sources/f1_gold_data/ \
          --source ${{ env.GOLD_CONTAINER_NAME }} \
          --pattern "*.parquet" \
          --auth-mode login

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './${{ env.DASHBOARD_DIR }}/package-lock.json'

    - name: Install Dependencies
      run: npm ci
      working-directory: ./${{ env.DASHBOARD_DIR }}

    - name: Run Evidence Sources Ingestion
      run: npm run sources
      working-directory: ./${{ env.DASHBOARD_DIR }}

    - name: Build Evidence Site
      run: npm run build
      working-directory: ./${{ env.DASHBOARD_DIR }}

    - name: Fetch SWA Token and Deploy Assets
      run: |
        SWA_DEPLOY_TOKEN=$(az staticwebapp secrets list \
          --name ${{ env.SWA_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "properties.apiKey" \
          --output tsv)
        
        echo "::add-mask::$SWA_DEPLOY_TOKEN"
        
        npx @azure/static-web-apps-cli deploy ./build \
          --deployment-token "$SWA_DEPLOY_TOKEN" \
          --env production \
          --app-location ./${{ env.DASHBOARD_DIR }}
      working-directory: ./${{ env.DASHBOARD_DIR }}