name: '1a. Core Infrastructure Deployment'

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Terraform Init
      run: terraform init -reconfigure
      working-directory: ./infra/env

    - name: Terraform Format Check
      run: terraform fmt -check
      working-directory: ./infra/env

    - name: Azure Login (Required for Firewall Punch)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Firewall Punch - Whitelist Current Plan Runner IP
      run: |
        CURRENT_IP=$(curl -s https://ifconfig.me)
        echo "INFO - Whitelisting Plan Runner IP: $CURRENT_IP"
        az storage account network-rule add \
          --resource-group rg-afdap123987123 \
          --account-name samainafdap123987123 \
          --ip-address $CURRENT_IP || echo "WARNING - Storage account does not exist yet."

    - name: Terraform Plan
      run: terraform plan -input=false -out=tfplan
      working-directory: ./infra/env

    - name: Firewall Clean - Remove Plan Runner IP
      if: always()
      run: |
        CURRENT_IP=$(curl -s https://ifconfig.me)
        echo "INFO - Removing Plan Runner IP: $CURRENT_IP"
        az storage account network-rule remove \
          --resource-group rg-afdap123987123 \
          --account-name samainafdap123987123 \
          --ip-address $CURRENT_IP || echo "WARNING - Storage account not found."

    - name: Upload Terraform Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: ./infra/env/tfplan
        retention-days: 1

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: [terraform-plan]
    environment: 'production'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Terraform Init
      run: terraform init -reconfigure
      working-directory: ./infra/env

    - name: Download Terraform Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: ./infra/env

    - name: Azure Login (Required for Firewall Punch)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Firewall Punch - Whitelist Current Apply Runner IP
      run: |
        CURRENT_IP=$(curl -s https://ifconfig.me)
        echo "INFO - Whitelisting Apply Runner IP: $CURRENT_IP"
        az storage account network-rule add \
          --resource-group rg-afdap123987123 \
          --account-name samainafdap123987123 \
          --ip-address $CURRENT_IP || echo "WARNING - Storage account does not exist yet."

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      working-directory: ./infra/env

    - name: Firewall Clean - Remove Apply Runner IP
      if: always()
      run: |
        CURRENT_IP=$(curl -s https://ifconfig.me)
        echo "INFO - Removing Apply Runner IP: $CURRENT_IP"
        az storage account network-rule remove \
          --resource-group rg-afdap123987123 \
          --account-name samainafdap123987123 \
          --ip-address $CURRENT_IP || echo "WARNING - Storage account not found."