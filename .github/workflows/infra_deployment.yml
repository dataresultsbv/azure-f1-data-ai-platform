name: '1. Core Infrastructure Deployment'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'infra/env/**'
  workflow_dispatch:
    inputs:
      environment_version:
        description: 'Manual override: Which version should be deployed? (eg, v1, v2)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    outputs:
      detected_version: ${{ steps.set-version.outputs.VERSION }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Detect Changed Environment
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          v1: ['infra/env/v1/**']
          v2: ['infra/env/v2/**']

    - name: Set Environment Version
      id: set-version
      run: |
        if [ ! -z "${{ github.event.inputs.environment_version }}" ]; then
          VERSION="${{ github.event.inputs.environment_version }}"
          echo "Deployment triggered via manual override."
        elif [ "${{ steps.filter.outputs.v2 }}" == 'true' ]; then
          VERSION="v2"
          echo "Deployment triggered via automated path detection (v2)."
        else
          VERSION="v1"
          echo "Deployment triggered via automated path detection or fallback (v1)."
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Terraform Init
      run: terraform init -reconfigure
      working-directory: ./infra/env/${{ env.VERSION }}

    - name: Terraform Format Check
      run: terraform fmt -check
      working-directory: ./infra/env/${{ env.VERSION }}

    - name: Terraform Plan
      run: terraform plan -input=false -out=tfplan
      working-directory: ./infra/env/${{ env.VERSION }}

    - name: Upload Terraform Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tfplan-${{ env.VERSION }}
        path: ./infra/env/${{ env.VERSION }}/tfplan
        retention-days: 1

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main'
    environment: 'production' 
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      VERSION: ${{ needs.terraform-plan.outputs.detected_version }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Terraform Init
      run: terraform init -reconfigure
      working-directory: ./infra/env/${{ env.VERSION }}

    - name: Download Terraform Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: tfplan-${{ env.VERSION }}
        path: ./infra/env/${{ env.VERSION }}

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      working-directory: ./infra/env/${{ env.VERSION }}