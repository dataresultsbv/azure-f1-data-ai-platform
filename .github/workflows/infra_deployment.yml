name: '1. Core Infrastructure Deployment'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'infra/env/**'
      - 'infra/modules/**'
  workflow_dispatch:
    inputs:
      environment_version:
        description: 'Manual override: Which version should be deployed? (eg, v1, v2)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  matrix-prep:
    name: 'Determine Deployment Scope'
    runs-on: ubuntu-latest
    outputs:
      matrix-envs: ${{ steps.set-matrix.outputs.matrix-envs }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Detect Changed Paths
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          v1:
            - 'infra/env/v1/**'
            - 'infra/modules/**'
          v2:
            - 'infra/env/v2/**'
            - 'infra/modules/**'

    - name: Generate Matrix Output
      id: set-matrix
      run: |
        ENV_LIST="[]"
        
        if [ ! -z "${{ github.event.inputs.environment_version }}" ]; then
          MANUAL_ENV="${{ github.event.inputs.environment_version }}"
          echo "INFO - Manual override detected. Target environment set to: '$MANUAL_ENV'"
          ENV_LIST="[\"$MANUAL_ENV\"]"

        else
          echo "INFO - No manual override detected. Evaluating changed paths..."

          if [ "${{ steps.filter.outputs.v1 }}" == 'true' ]; then
            echo "INFO - Changes detected in infra/env/v1 or modules. Adding 'v1' to matrix."
            ENV_LIST=$(echo $ENV_LIST | jq '. + ["v1"]')
          fi
          
          if [ "${{ steps.filter.outputs.v2 }}" == 'true' ]; then
            echo "INFO - Changes detected in infra/env/v2 or modules. Adding 'v2' to matrix."
            ENV_LIST=$(echo $ENV_LIST | jq '. + ["v2"]')
          fi
        fi
        
        echo "SUCCESS - Calculated deployment matrix: $ENV_LIST"        
        echo "matrix-envs=$ENV_LIST" >> $GITHUB_OUTPUT

  terraform-plan:
    name: 'Terraform Plan (${{ matrix.env }})'
    runs-on: ubuntu-latest
    needs: matrix-prep
    if: needs.matrix-prep.outputs.matrix-envs != '[]' && needs.matrix-prep.outputs.matrix-envs != ''
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.matrix-prep.outputs.matrix-envs) }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Terraform Init
      run: terraform init -reconfigure
      working-directory: ./infra/env/${{ matrix.env }}

    - name: Terraform Format Check
      run: terraform fmt -check
      working-directory: ./infra/env/${{ matrix.env }}

    - name: Terraform Plan
      run: terraform plan -input=false -out=tfplan
      working-directory: ./infra/env/${{ matrix.env }}

    - name: Upload Terraform Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tfplan-${{ matrix.env }}
        path: ./infra/env/${{ matrix.env }}/tfplan
        retention-days: 1

  terraform-apply:
    name: 'Terraform Apply (${{ matrix.env }})'
    runs-on: ubuntu-latest
    needs: [matrix-prep, terraform-plan]
    if: needs.matrix-prep.outputs.matrix-envs != '[]' && needs.matrix-prep.outputs.matrix-envs != ''
    environment: 'production'
    strategy:
      matrix:
        env: ${{ fromJson(needs.matrix-prep.outputs.matrix-envs) }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Terraform Init
      run: terraform init -reconfigure
      working-directory: ./infra/env/${{ matrix.env }}

    - name: Download Terraform Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: tfplan-${{ matrix.env }}
        path: ./infra/env/${{ matrix.env }}

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      working-directory: ./infra/env/${{ matrix.env }}