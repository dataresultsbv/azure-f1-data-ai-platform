name: '2. F1 Ingestion Container Deployment'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/ingestion/f1-api/**' # Triggers only on changes within the F1 API folder
  workflow_dispatch:

jobs:
  build-and-push:
    name: 'Build and Push F1 Image to ACR'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC (Managed Identity)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to Azure Container Registry
      run: |
        az acr login --name acrafdap123987123

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push F1 Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./src/ingestion/f1-api
        file: ./src/ingestion/f1-api/Dockerfile
        push: true
        tags: |
          acrafdap123987123.azurecr.io/f1-api-ingestion:latest
          acrafdap123987123.azurecr.io/f1-api-ingestion:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max