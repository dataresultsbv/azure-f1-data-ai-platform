name: '2a. F1 Ingestion CI'

on:
  push:
    branches-ignore: [main]
    paths: ['src/ingestion/f1_api/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['src/ingestion/f1_api/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-validation:
    name: 'Unit Tests: Ingestion'
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'src/ingestion/f1_api/requirements.txt'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: src/ingestion/f1_api

    - name: Run Unit Tests
      env: { PYTHONPATH: . }
      run: python -m pytest -v -m "not integration"
      working-directory: src/ingestion/f1_api